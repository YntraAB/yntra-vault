name: Release & Multi-Platform Assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (AppImage & Deb)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config

      - name: Install Node dependencies
        run: bun install

      - name: Build Linux Packages
        run: bun run tauri build --bundles appimage,deb

      - name: Upload Linux Packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name || 'v0.1.7' }}
          files: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        id: setup-java
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Set Android Environment Variables
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Install Rust toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Node dependencies
        run: bun install

      - name: Initialize Android project
        run: bun run tauri android init --ci

      - name: Build Android APK
        run: bun run tauri android build --ci --apk

      - name: Sign & Prepare Android APK
        run: |
          mkdir -p release-assets
          keytool -genkeypair -v -keystore release.jks -alias yntra -keyalg RSA -keysize 2048 -validity 10000 -storepass yntravault -keypass yntravault -dname "CN=YntraVault, OU=Mobile, O=YntraAB, L=Stockholm, S=Stockholm, C=SE"
          APK_FILE=$(find . -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          if [ -n "$APK_FILE" ]; then
            jarsigner -keystore release.jks -storepass yntravault -keypass yntravault "$APK_FILE" yntra
            cp "$APK_FILE" release-assets/Yntra.Vault_0.1.7_universal.apk
            echo "Signed APK copied to release-assets/Yntra.Vault_0.1.7_universal.apk"
          fi

      - name: Upload Android APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name || 'v0.1.7' }}
          files: |
            release-assets/*.apk
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            gen/android/app/build/outputs/apk/**/*.apk

  build-windows:
    name: Build Windows (NSIS & MSI)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node dependencies
        run: bun install

      - name: Build Windows Packages
        run: bun run tauri build --bundles nsis,msi

      - name: Upload Windows Packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name || 'v0.1.7' }}
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-macos:
    name: Build macOS (DMG)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node dependencies
        run: bun install

      - name: Build macOS Packages
        run: bun run tauri build --bundles dmg

      - name: Upload macOS Packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name || 'v0.1.7' }}
          files: |
            target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg
