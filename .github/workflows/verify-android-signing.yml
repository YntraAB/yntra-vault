name: Verify Android signing identity

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    if: github.repository == 'YntraAB/yntra-vault' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare pinned Android verification tools without credentials
        run: sdkmanager 'build-tools;37.0.0'
      - name: Verify permanent keystore certificate only
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          umask 077
          KEYSTORE="$RUNNER_TEMP/identity.p12"
          trap 'rm -f "$KEYSTORE" "$RUNNER_TEMP/identity.der"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          keytool -exportcert -alias yntra -keystore "$KEYSTORE" -storetype PKCS12 -storepass:env ANDROID_KEYSTORE_PASSWORD -file "$RUNNER_TEMP/identity.der"
          echo "6360e0c97cc43206e58b7fd4351ab38afe1c7e096d15056bdcac6b87e91f7ff0  $RUNNER_TEMP/identity.der" | sha256sum --check
      - name: Verify the pinned published package without signing credentials
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          test -x "$BUILD_TOOLS/apksigner"
          curl --fail --location --proto '=https' --proto-redir '=https' 'https://github.com/YntraAB/yntra-vault/releases/download/v0.2.3/Yntra.Vault_0.2.3_universal.apk' --output "$RUNNER_TEMP/published.apk"
          echo "bac5b92eca711067ebcb0001b51a10769b79f30d032fa6438692b4c89d10f395  $RUNNER_TEMP/published.apk" | sha256sum --check
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/published.apk" > "$RUNNER_TEMP/public-certificates.txt"
          "$BUILD_TOOLS/aapt" dump badging "$RUNNER_TEMP/published.apk" > "$RUNNER_TEMP/badging.txt"
          node scripts/verify-android-update.mjs "$RUNNER_TEMP/badging.txt" "$RUNNER_TEMP/public-certificates.txt" '0.2.3'
