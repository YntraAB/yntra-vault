name: SOTA Reproducible Builds CI & Attestation

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions: {}

jobs:
  verify-reproducible-linux:
    name: Reproducible Build Verification (Linux / Docker)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          toolchain: '1.95.0'

      - name: Run Hermetic Docker Reproducible Build
        run: |
          docker build -t yntra-vault-reproducible -f Dockerfile.reproducible .
          docker run --rm yntra-vault-reproducible

      - name: Execute Dual-Build Verification Suite (Linux Native)
        run: |
          chmod +x ./scripts/*.sh
          ./scripts/verify-reproducible.sh

      - name: Upload Reproducible Manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reproducible-manifest-linux
          path: reproducible-dist/reproducible-manifest.json
          if-no-files-found: ignore

  verify-reproducible-windows:
    name: Reproducible Build Verification (Windows MSVC)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          toolchain: '1.95.0'

      - name: Execute Dual-Build Verification Suite (Windows PowerShell)
        run: |
          powershell -ExecutionPolicy Bypass -File ./scripts/verify-reproducible.ps1

