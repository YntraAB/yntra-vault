[workspace]
members = [
    "crates/crypto",
    "crates/core",
    "crates/cli",
    "src-tauri",
]
exclude = [
    "fuzz",
    "vendor/glib",
]
resolver = "2"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
# GTK3 currently requires GLib 0.18; documented upstream soundness backport.
glib = { path = "vendor/glib" }
