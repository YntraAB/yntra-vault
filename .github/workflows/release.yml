name: Release & Multi-Platform Assets

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: Target job to run
        required: false
        default: all
        type: choice
        options: [all, android, windows, linux]
      tag:
        description: Existing release tag to build (must match source version)
        required: true
        default: 'v0.2.5'

permissions: {}

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'YntraAB/yntra-vault'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Validate source and preserve draft provenance
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node -e 'const tag=process.env.RELEASE_TAG;if(!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag)||tag!=="v"+require("./package.json").version)process.exit(1)'
          SOURCE_COMMIT=$(git rev-parse HEAD)
          export SOURCE_COMMIT
          echo "commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Yntra Vault $RELEASE_TAG" --notes "Building release packages."
          elif [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]; then
            echo 'This release is published. Use a new version; shipped binaries are immutable.'
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq release-source.json; then
            gh release download "$RELEASE_TAG" --pattern release-source.json --output "$RUNNER_TEMP/release-source.json"
            node -e 'const p=JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/release-source.json"));if(p.commit!==process.env.SOURCE_COMMIT||p.tag!==process.env.RELEASE_TAG)throw Error("Draft assets belong to another source revision")'
          else
            test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')" = 0 || { echo 'Existing draft lacks source provenance; review it before continuing.'; exit 1; }
            node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP+"/release-source.json",JSON.stringify({tag:process.env.RELEASE_TAG,commit:process.env.SOURCE_COMMIT})+"\n")'
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/release-source.json"
          fi
      - name: Preserve pinned Android upgrade fixture
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p startup-baseline
          gh release download v0.2.4 --pattern 'Yntra.Vault_0.2.4_universal.apk' --output startup-baseline/baseline.apk
          if echo 'e13d490a19a6fd9e4c2c7e90a99f435084d3ae44f2573069d53df667c2b59ab4  startup-baseline/baseline.apk' | sha256sum --check; then
            echo healthy > startup-baseline/mode.txt
          elif echo 'c83176271cd3c79eade6f6de1f06eb67982a123dacdda246e120a5d1e3c2c896  startup-baseline/baseline.apk' | sha256sum --check; then
            echo broken > startup-baseline/mode.txt
          else
            gh release download v0.2.3 --pattern 'Yntra.Vault_0.2.3_universal.apk' --output startup-baseline/baseline.apk --clobber
            echo 'bac5b92eca711067ebcb0001b51a10769b79f30d032fa6438692b4c89d10f395  startup-baseline/baseline.apk' | sha256sum --check
            echo healthy > startup-baseline/mode.txt
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          overwrite: true
          name: android-startup-baseline
          path: startup-baseline/
          retention-days: 30

  build-linux:
    needs: prepare
    name: Build Linux (AppImage & Deb)
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'linux'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          toolchain: '1.95.0'
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl file libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config
      - run: bun install --frozen-lockfile
      - name: Build Linux packages
        run: |
          set -euo pipefail
          bun run tauri build --bundles appimage,deb -- --locked
          mkdir -p release-assets
          VER=$(node -p 'require("./package.json").version')
          cp target/release/bundle/appimage/*.AppImage "release-assets/Yntra.Vault_${VER}_amd64.AppImage"
          cp target/release/bundle/deb/*.deb "release-assets/Yntra.Vault_${VER}_amd64.deb"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          overwrite: true
          name: release-linux
          path: release-assets/*
          if-no-files-found: error

  build-android:
    needs: prepare
    name: Build unsigned Android APK
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'android'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1, peeled commit
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true
      - name: Configure Android environment
        env:
          INSTALLED_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          echo 'ANDROID_HOME=/usr/local/lib/android/sdk' >> "$GITHUB_ENV"
          echo 'ANDROID_SDK_ROOT=/usr/local/lib/android/sdk' >> "$GITHUB_ENV"
          echo "NDK_HOME=$INSTALLED_NDK" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          toolchain: '1.95.0'
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - run: bun install --frozen-lockfile
      - name: Initialize Android project and apply app customizations
        run: |
          set -euo pipefail
          bun run tauri android init --ci
          node scripts/apply-android-customizations.js
          for res_dir in src-tauri/gen/android/app/src/main/res gen/android/app/src/main/res; do
            if [ -d "$res_dir" ] && [ -d src-tauri/icons/android ]; then
              cp -R src-tauri/icons/android/. "$res_dir/"
            fi
          done
      - name: Build and stage unsigned APK
        run: |
          set -euo pipefail
          bun run tauri android build --ci --apk
          mapfile -t APKS < <(find src-tauri/gen/android -type f -name '*universal*unsigned.apk')
          test "${#APKS[@]}" = 1 || { echo 'Expected exactly one unsigned universal APK'; exit 1; }
          mkdir -p android-unsigned
          cp "${APKS[0]}" android-unsigned/universal-unsigned.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          overwrite: true
          name: android-unsigned
          path: android-unsigned/universal-unsigned.apk
          if-no-files-found: error
          retention-days: 3

  sign-android:
    name: Sign Android on a fresh runner
    needs: [prepare, build-android]
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-unsigned
          path: android-unsigned/
      - name: Prepare pinned Android signing tools without credentials
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          if [ ! -d "$ANDROID_HOME/build-tools/37.0.0" ]; then
            yes | sdkmanager 'build-tools;37.0.0'
          fi
      - name: Sign with permanent release identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          umask 077
          KEYSTORE="$RUNNER_TEMP/yntra-release.p12"
          trap 'rm -f "$KEYSTORE" "$RUNNER_TEMP/aligned.apk"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          test -x "$BUILD_TOOLS/apksigner"
          mkdir -p signed-android
          "$BUILD_TOOLS/zipalign" -f -p 4 android-unsigned/universal-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-type PKCS12 --ks-key-alias yntra --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD --out "signed-android/Yntra.Vault_${RELEASE_VERSION}_universal.apk" "$RUNNER_TEMP/aligned.apk"
      - name: Verify signed package identity without signing credentials
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          APK="signed-android/Yntra.Vault_${RELEASE_VERSION}_universal.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apk-signing.txt"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          node scripts/verify-android-update.mjs "$RUNNER_TEMP/apk-badging.txt" "$RUNNER_TEMP/apk-signing.txt" "$RELEASE_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          overwrite: true
          name: android-signed
          path: signed-android/*.apk
          if-no-files-found: error
          retention-days: 3

  verify-android:
    name: Validate Android startup on a separate runner
    needs: [prepare, sign-android]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-signed
          path: release-assets/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-startup-baseline
          path: startup-baseline/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify fresh startup and in-place upgrade
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2, peeled commit
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/android-startup-smoke.py --baseline startup-baseline/baseline.apk --baseline-mode "$(cat startup-baseline/mode.txt)" --apk "release-assets/Yntra.Vault_$(node -p 'require("./package.json").version')_universal.apk"
      - name: Preserve startup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          overwrite: true
          name: android-startup-evidence
          path: android-smoke-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          overwrite: true
          name: release-android
          path: release-assets/*.apk
          if-no-files-found: error

  build-windows:
    needs: prepare
    name: Build Windows (NSIS, MSI, Portable & CLI)
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'windows'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          toolchain: '1.95.0'
      - run: bun install --frozen-lockfile
      - name: Build Windows packages
        shell: bash
        run: |
          set -euo pipefail
          bun run tauri build --bundles nsis,msi -- --locked
          cargo build --release -p yntra-cli --locked
          mkdir -p release-assets
          VER=$(node -p 'require("./package.json").version')
          cp target/release/yntra-vault-app.exe "release-assets/Yntra.Vault_${VER}_portable.exe"
          cp target/release/yntra.exe "release-assets/Yntra.Vault_${VER}_cli.exe"
          cp target/release/bundle/nsis/*.exe "release-assets/Yntra.Vault_${VER}_x64-setup.exe"
          cp target/release/bundle/msi/*.msi "release-assets/Yntra.Vault_${VER}_x64_en-US.msi"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          overwrite: true
          name: release-windows
          path: release-assets/*
          if-no-files-found: error

  build-macos:
    needs: prepare
    name: Build macOS (DMG)
    if: github.event_name == 'push' || inputs.target == 'all'
    runs-on: macos-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          toolchain: '1.95.0'
      - run: bun install --frozen-lockfile
      - name: Build macOS package
        run: |
          set -euo pipefail
          bun run tauri build --bundles dmg -- --locked
          mkdir -p release-assets
          cp target/release/bundle/dmg/*.dmg release-assets/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          overwrite: true
          name: release-macos
          path: release-assets/*.dmg
          if-no-files-found: error

  stage-packages:
    name: Retain verified packages in the unpublished draft
    needs: [prepare, build-linux, build-windows, verify-android, build-macos]
    if: always() && needs.prepare.result == 'success' && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-assets/
          merge-multiple: true
      - name: Stage completed packages for this source revision only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_COMMIT"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern release-source.json --output "$RUNNER_TEMP/release-source.json"
          node -e 'const p=JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/release-source.json"));if(p.commit!==process.env.RELEASE_COMMIT||p.tag!==process.env.RELEASE_TAG)throw Error("Draft source mismatch")'
          shopt -s nullglob
          packages=(release-assets/*)
          if [ "${#packages[@]}" -gt 0 ]; then
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${packages[@]}" --clobber
          fi

  finalize:
    name: Sign metadata and publish the complete release
    needs: [prepare, build-linux, build-windows, build-android, sign-android, verify-android, build-macos, stage-packages]
    if: always() && needs.prepare.result == 'success' && needs.stage-packages.result == 'success' && !contains(needs.*.result, 'cancelled') && needs.build-linux.result != 'failure' && needs.build-windows.result != 'failure' && needs.build-android.result != 'failure' && needs.sign-android.result != 'failure' && needs.verify-android.result != 'failure'
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write
    env:
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Verify the complete draft and generate checksummed metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_COMMIT"
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --dir release-assets
          node -e 'const p=JSON.parse(require("fs").readFileSync("release-assets/release-source.json"));if(p.commit!==process.env.RELEASE_COMMIT||p.tag!==process.env.RELEASE_TAG)throw Error("Draft source mismatch")'
          node scripts/release-metadata.mjs "$RELEASE_TAG"
      - name: Sign exact update metadata using the pinned update identity
        env:
          YNTRA_UPDATE_SIGNING_KEY: ${{ secrets.YNTRA_UPDATE_SIGNING_KEY }}
        run: node scripts/sign-update-manifest.mjs release-assets/latest.json
      - name: Publish only after signature and all packages exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -s release-assets/latest.json.sig
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_COMMIT"
          gh release upload "$RELEASE_TAG" release-assets/latest.json release-assets/latest.json.sig release-assets/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --title "Yntra Vault $RELEASE_TAG" --notes-file RELEASE_NOTES.md --draft=false --latest

