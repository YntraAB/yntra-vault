name: Release & Multi-Platform Assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target job to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - android
          - windows
          - linux
      tag:
        description: 'Existing release tag to build (must match source version)'
        required: true
        default: 'v0.2.4'

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'YntraAB/yntra-vault'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Validate release version and create draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node -e 'if (process.env.RELEASE_TAG !== "v" + require("./package.json").version) process.exit(1)'
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Yntra Vault $RELEASE_TAG" --notes "Building release packages."
          elif [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "This release is already published. Use a new version instead of replacing shipped binaries."
            exit 1
          fi

      - name: Preserve pinned Android upgrade fixture before package replacement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p startup-baseline
          gh release download v0.2.4 --pattern 'Yntra.Vault_0.2.4_universal.apk' --output startup-baseline/baseline.apk
          if echo 'c83176271cd3c79eade6f6de1f06eb67982a123dacdda246e120a5d1e3c2c896  startup-baseline/baseline.apk' | sha256sum --check; then
            echo broken > startup-baseline/mode.txt
          else
            gh release download v0.2.3 --pattern 'Yntra.Vault_0.2.3_universal.apk' --output startup-baseline/baseline.apk --clobber
            echo 'bac5b92eca711067ebcb0001b51a10769b79f30d032fa6438692b4c89d10f395  startup-baseline/baseline.apk' | sha256sum --check
            echo healthy > startup-baseline/mode.txt
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-startup-baseline
          path: startup-baseline/
          retention-days: 30

  build-linux:
    needs: prepare
    name: Build Linux (AppImage & Deb)
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'linux'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config

      - name: Install Node dependencies
        run: bun install --frozen-lockfile

      - name: Build Linux Packages
        run: |
          bun run tauri build --bundles appimage,deb -- --locked
          mkdir -p release-assets
          VER=$(node -p 'require("./package.json").version')
          cp target/release/bundle/appimage/*.AppImage "release-assets/Yntra.Vault_${VER}_amd64.AppImage"
          cp target/release/bundle/deb/*.deb "release-assets/Yntra.Vault_${VER}_amd64.deb"

      - name: Upload Linux Packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Yntra Vault ${{ inputs.tag || github.ref_name }}
          draft: true
          files: release-assets/*

  build-android:
    needs: prepare
    name: Build Android APK
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'android'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        id: setup-java
        with:
            distribution: 'temurin'
            java-version: '17'

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Set Android Environment Variables
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Install Rust toolchain & Android Targets
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Node dependencies
        run: bun install --frozen-lockfile

      - name: Initialize Android project, Apply Permissions & App Icons
        run: |
          bun run tauri android init --ci
          node scripts/apply-android-customizations.js
          for res_dir in src-tauri/gen/android/app/src/main/res gen/android/app/src/main/res; do
            if [ -d "$res_dir" ] && [ -d "src-tauri/icons/android" ]; then
              echo "Applying Yntra Vault Android app icons to $res_dir..."
              cp -rf src-tauri/icons/android/* "$res_dir/"
              ls -la "$res_dir/mipmap-hdpi"
            fi
          done

      - name: Build Android APK
        run: bun run tauri android build --ci --apk

      - name: Sign APK with permanent release identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          umask 077
          KEYSTORE="$RUNNER_TEMP/yntra-release.p12"
          trap 'rm -f "$KEYSTORE" "$RUNNER_TEMP/aligned.apk"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          mkdir -p release-assets
          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          test -x "$BUILD_TOOLS/apksigner"
          APK_FILE=$(find src-tauri/gen/android -type f -name '*universal*unsigned.apk' | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find src-tauri/gen/android -type f -name '*universal*.apk' | head -n 1)
          fi
          test -n "$APK_FILE"
          VER=$(node -p 'require("./package.json").version')
          OUT_APK="release-assets/Yntra.Vault_${VER}_universal.apk"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK_FILE" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-type PKCS12 --ks-key-alias yntra --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD --out "$OUT_APK" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUT_APK" > "$RUNNER_TEMP/apk-signing.txt"
          "$BUILD_TOOLS/aapt" dump badging "$OUT_APK" > "$RUNNER_TEMP/apk-badging.txt"
          node scripts/verify-android-update.mjs "$RUNNER_TEMP/apk-badging.txt" "$RUNNER_TEMP/apk-signing.txt" "$VER"

      - name: Enable KVM for Android startup verification
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v4
        with:
          name: android-startup-baseline
          path: startup-baseline/

      - name: Verify signed APK fresh startup and in-place upgrade
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/android-startup-smoke.py --baseline startup-baseline/baseline.apk --baseline-mode "$(cat startup-baseline/mode.txt)" --apk "release-assets/Yntra.Vault_$(node -p 'require("./package.json").version')_universal.apk"

      - name: Preserve emulator startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-startup-evidence
          path: android-smoke-results/
          if-no-files-found: ignore

      - name: Upload Android APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "Uploading universal APK to release $TAG with GitHub CLI..."
          for i in 1 2 3; do
            echo "Upload attempt $i..."
            if gh release upload "$TAG" release-assets/*.apk --clobber; then
              echo "Upload successful!"
              exit 0
            fi
            echo "Upload attempt $i failed, waiting 10s before retry..."
            sleep 10
          done
          echo "Failed to upload APK after 3 attempts."
          exit 1

  build-windows:
    needs: prepare
    name: Build Windows (NSIS, MSI, Portable & CLI)
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'windows'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install Node dependencies
        run: bun install --frozen-lockfile

      - name: Build Windows Packages
        shell: bash
        run: |
          bun run tauri build --bundles nsis,msi -- --locked
          cargo build --release -p yntra-cli --locked
          mkdir -p release-assets
          TAG="${{ inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          cp target/release/yntra-vault-app.exe "release-assets/Yntra.Vault_${VER}_portable.exe"
          cp target/release/yntra.exe "release-assets/Yntra.Vault_${VER}_cli.exe"
          cp target/release/bundle/nsis/*.exe "release-assets/Yntra.Vault_${VER}_x64-setup.exe"
          cp target/release/bundle/msi/*.msi "release-assets/Yntra.Vault_${VER}_x64_en-US.msi"

      - name: Upload Windows Packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Yntra Vault ${{ inputs.tag || github.ref_name }}
          draft: true
          files: release-assets/*

  build-macos:
    needs: prepare
    name: Build macOS (DMG)
    if: github.event_name == 'push' || inputs.target == 'all'
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install Node dependencies
        run: bun install --frozen-lockfile

      - name: Build macOS Packages
        run: bun run tauri build --bundles dmg

      - name: Upload macOS Packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Yntra Vault ${{ inputs.tag || github.ref_name }}
          draft: true
          files: |
            target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg

  finalize:
    name: Verify packages and publish complete release
    needs: [prepare, build-linux, build-windows, build-android, build-macos]
    if: always() && needs.prepare.result == 'success' && !contains(needs.*.result, 'cancelled') && needs.build-linux.result != 'failure' && needs.build-windows.result != 'failure' && needs.build-android.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Download all required assets and generate verified metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --dir release-assets
          node scripts/release-metadata.mjs "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" release-assets/latest.json release-assets/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --title "Yntra Vault $RELEASE_TAG" --notes-file RELEASE_NOTES.md --draft=false --latest
