name: Release & Multi-Platform Assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target job to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - android
          - windows
          - linux
      tag:
        description: 'Release tag (e.g. v0.1.8)'
        required: false
        default: 'v0.1.8'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (AppImage & Deb)
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'linux'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config

      - name: Install Node dependencies
        run: bun install

      - name: Build Linux Packages
        run: bun run tauri build --bundles appimage,deb

      - name: Upload Linux Packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Yntra Vault ${{ inputs.tag || github.ref_name }}
          files: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  build-android:
    name: Build Android APK
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'android'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        id: setup-java
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Set Android Environment Variables
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Install Rust toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Node dependencies
        run: bun install

      - name: Initialize Android project, Apply Permissions & App Icons
        run: |
          bun run tauri android init --ci
          node scripts/apply-android-customizations.js
          for res_dir in src-tauri/gen/android/app/src/main/res gen/android/app/src/main/res; do
            if [ -d "$res_dir" ] && [ -d "src-tauri/icons/android" ]; then
              echo "Applying Yntra Vault Android app icons to $res_dir..."
              cp -rf src-tauri/icons/android/* "$res_dir/"
              ls -la "$res_dir/mipmap-hdpi"
            fi
          done

      - name: Build Android APK
        run: bun run tauri android build --ci --apk

      - name: Sign & Prepare Android APK
        run: |
          mkdir -p release-assets
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          echo "Using Android build-tools: $BUILD_TOOLS"

          keytool -genkeypair -v -keystore release.jks -alias yntra -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass yntravault -keypass yntravault \
            -dname "CN=YntraVault, OU=Mobile, O=YntraAB, L=Stockholm, S=Stockholm, C=SE"

          APK_FILE=$(find . -name "*unsigned.apk" -o -name "*universal*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"

          TAG="${{ inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          OUT_APK="release-assets/Yntra.Vault_${VER}_universal.apk"

          if [ -n "$APK_FILE" ]; then
            echo "Running zipalign 4-byte alignment..."
            $BUILD_TOOLS/zipalign -v -p 4 "$APK_FILE" aligned.apk

            echo "Signing with apksigner (Scheme v1, v2, v3 enabled)..."
            $BUILD_TOOLS/apksigner sign \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --ks release.jks \
              --ks-pass pass:yntravault \
              --key-pass pass:yntravault \
              --ks-key-alias yntra \
              --out "$OUT_APK" \
              aligned.apk

            echo "Verifying APK signature scheme..."
            $BUILD_TOOLS/apksigner verify --verbose "$OUT_APK"

            echo "Signed and verified universal APK ready at $OUT_APK"
            rm -f aligned.apk
            rm -f "$APK_FILE"
          fi

      - name: Upload Android APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "Uploading universal APK to release $TAG with GitHub CLI..."
          for i in 1 2 3; do
            echo "Upload attempt $i..."
            if gh release upload "$TAG" release-assets/*.apk --clobber; then
              echo "Upload successful!"
              exit 0
            fi
            echo "Upload attempt $i failed, waiting 10s before retry..."
            sleep 10
          done
          echo "Failed to upload APK after 3 attempts."
          exit 1

  build-windows:
    name: Build Windows (NSIS, MSI, Portable & CLI)
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'windows'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node dependencies
        run: bun install

      - name: Build Windows Packages
        shell: bash
        run: |
          bun run tauri build --bundles nsis,msi
          cargo build --release -p yntra-cli
          mkdir -p release-assets
          TAG="${{ inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          cp target/release/yntra-vault-app.exe "release-assets/Yntra.Vault_${VER}_portable.exe"
          cp target/release/yntra.exe "release-assets/Yntra.Vault_${VER}_cli.exe"

      - name: Extract Release Notes from CHANGELOG
        shell: bash
        run: |
          bun -e "
            const fs = require('fs');
            const cl = fs.readFileSync('CHANGELOG.md', 'utf8');
            const tag = process.env.GITHUB_REF_NAME || 'v0.1.8';
            const ver = tag.replace(/^v/, '');
            const m = cl.match(new RegExp('## \\\\[?' + ver.replace(/\./g, '\\\\.') + '[^\\n]*([\\s\\S]*?)(?=\\n## |$)'));
            if (m) {
              const downloads = '\n\n### Downloads\n- **Standard Windows Setup**: `Yntra.Vault_' + ver + '_x64-setup.exe` (Recommended desktop installer)\n- **MSI Installer**: `Yntra.Vault_' + ver + '_x64_en-US.msi` (Windows Installer package)\n- **Portable Executable**: `Yntra.Vault_' + ver + '_portable.exe` (Standalone desktop app, runs directly without installation)\n- **Command-Line Interface (CLI)**: `Yntra.Vault_' + ver + '_cli.exe` (Terminal tool for PowerShell / CMD scripts)\n- **Linux AppImage**: `Yntra.Vault_' + ver + '_amd64.AppImage` (Universal standalone Linux package)\n- **Linux Debian Package**: `Yntra.Vault_' + ver + '_amd64.deb` (Ubuntu / Debian installer)\n- **Android APK**: `Yntra.Vault_' + ver + '_universal.apk` (Signed universal package for direct Android installation)';
              const content = '## Yntra Vault ' + tag + '\n\n' + m[1].trim() + downloads;
              fs.writeFileSync('RELEASE_NOTES.md', content);
            }
          "

      - name: Upload Windows Packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Yntra Vault ${{ inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            release-assets/*.exe

  build-macos:
    name: Build macOS (DMG)
    if: github.event_name == 'push' || inputs.target == 'all'
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node dependencies
        run: bun install

      - name: Build macOS Packages
        run: bun run tauri build --bundles dmg

      - name: Upload macOS Packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Yntra Vault ${{ inputs.tag || github.ref_name }}
          files: |
            target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg
